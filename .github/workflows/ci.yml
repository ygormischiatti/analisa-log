name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t analisa-log:ci .

      - name: Executar o analisador
        run: |
          docker run --rm analisa-log:ci > resultado.txt
          cat resultado.txt

      - name: Validar resultado
        run: grep -q "203.0.113.10" resultado.txt
